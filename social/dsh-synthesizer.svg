<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <style>
      .paper { fill: #f5f5f5; }
      .zone { fill: #ececec; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .card { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; }
      .card-soft { fill: #f5f5f5; stroke: rgba(45,49,66,0.16); stroke-width: 1; }
      .card-accent { fill: rgba(77,107,254,0.08); stroke: #4d6bfe; stroke-width: 1.4; }
      .outer { fill: none; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .rule { stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .arrow { stroke: #2d3142; stroke-width: 1.2; }
      .arrowhead { fill: #2d3142; }
      .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; fill: #7a8399; }
      .tag { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; fill: #4d6bfe; }
      .title { font-family: "Geist", "PingFang SC", sans-serif; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; fill: #2d3142; }
      .subtitle { font-family: "Geist", "PingFang SC", sans-serif; font-size: 20px; font-weight: 400; fill: #4f5d75; }
      .name { font-family: "Geist", "PingFang SC", sans-serif; font-size: 18px; font-weight: 600; fill: #2d3142; }
      .mono { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; fill: #4f5d75; }
      .mono-accent { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; font-weight: 500; fill: #4d6bfe; }
      .cmd { font-family: "Geist Mono", monospace; font-size: 16px; fill: #2d3142; }
      .footer { font-family: "Geist", "PingFang SC", sans-serif; font-size: 15px; fill: #4f5d75; }
      .footer-link { font-family: "Geist Mono", monospace; font-size: 15px; font-weight: 500; fill: #4d6bfe; }
      .step0 { fill: #ffffff; stroke: rgba(45,49,66,0.16); stroke-width: 1; }
      .step2 { fill: rgba(45,49,66,0.22); }
      .stephot { fill: #4d6bfe; }
    </style>
  </defs>

  <rect width="900" height="1200" class="paper"/>
  <rect x="28" y="28" width="844" height="1144" rx="8" class="outer"/>

  <!-- Header -->
  <text x="60" y="76" class="eyebrow">03 · 合成器 · V1.3.0</text>
  <text x="840" y="76" text-anchor="end" class="tag">DEEPSEEK HARNESS PLUGIN</text>
  <text x="60" y="138" class="title">dsh-synthesizer</text>
  <text x="60" y="178" class="subtitle">Web Audio 多轨合成器与口袋律动工作站</text>
  <line x1="60" y1="208" x2="840" y2="208" class="rule"/>

  <!-- Transport Bar -->
  <rect x="60" y="236" width="780" height="64" rx="6" class="zone"/>
  <text x="84" y="274" class="mono">走带：播放 / 循环</text>
  <text x="310" y="274" class="mono">120 BPM · 摇摆 33%</text>
  <text x="536" y="274" class="mono">4 小节 · ⌘Z 撤销</text>
  <text x="816" y="274" text-anchor="end" class="mono-accent">500ms 自动保存</text>

  <!-- Sequencer Zone -->
  <rect x="60" y="320" width="780" height="304" rx="6" class="zone"/>
  <text x="84" y="352" class="eyebrow">音序器 · 钢琴卷帘与 8 件套鼓机</text>
  <rect x="84" y="370" width="732" height="176" rx="4" class="card"/>
  <!-- 8x4 Grid -->
  <g transform="translate(108,392)">
    <rect x="0" y="0" width="78" height="28" rx="3" class="stephot"/>
    <rect x="86" y="0" width="78" height="28" rx="3" class="step0"/>
    <rect x="172" y="0" width="78" height="28" rx="3" class="step0"/>
    <rect x="258" y="0" width="78" height="28" rx="3" class="step2"/>
    <rect x="344" y="0" width="78" height="28" rx="3" class="step0"/>
    <rect x="430" y="0" width="78" height="28" rx="3" class="step2"/>
    <rect x="516" y="0" width="78" height="28" rx="3" class="step0"/>
    <rect x="602" y="0" width="78" height="28" rx="3" class="step0"/>

    <rect x="0" y="36" width="78" height="28" rx="3" class="step0"/>
    <rect x="86" y="36" width="78" height="28" rx="3" class="step2"/>
    <rect x="172" y="36" width="78" height="28" rx="3" class="step0"/>
    <rect x="258" y="36" width="78" height="28" rx="3" class="step0"/>
    <rect x="344" y="36" width="78" height="28" rx="3" class="stephot"/>
    <rect x="430" y="36" width="78" height="28" rx="3" class="step0"/>
    <rect x="516" y="36" width="78" height="28" rx="3" class="step2"/>
    <rect x="602" y="36" width="78" height="28" rx="3" class="step0"/>

    <rect x="0" y="72" width="78" height="28" rx="3" class="step2"/>
    <rect x="86" y="72" width="78" height="28" rx="3" class="step0"/>
    <rect x="172" y="72" width="78" height="28" rx="3" class="step2"/>
    <rect x="258" y="72" width="78" height="28" rx="3" class="step0"/>
    <rect x="344" y="72" width="78" height="28" rx="3" class="step2"/>
    <rect x="430" y="72" width="78" height="28" rx="3" class="step0"/>
    <rect x="516" y="72" width="78" height="28" rx="3" class="step2"/>
    <rect x="602" y="72" width="78" height="28" rx="3" class="step0"/>

    <rect x="0" y="108" width="78" height="22" rx="3" class="step0"/>
    <rect x="86" y="108" width="78" height="22" rx="3" class="step2"/>
    <rect x="172" y="108" width="78" height="22" rx="3" class="step0"/>
    <rect x="258" y="108" width="78" height="22" rx="3" class="step2"/>
    <rect x="344" y="108" width="78" height="22" rx="3" class="step0"/>
    <rect x="430" y="108" width="78" height="22" rx="3" class="step2"/>
    <rect x="516" y="108" width="78" height="22" rx="3" class="step0"/>
    <rect x="602" y="108" width="78" height="22" rx="3" class="step2"/>
  </g>
  <text x="84" y="578" class="mono">力度条 · 调式高亮 · 一键生成乐句</text>
  <text x="816" y="578" text-anchor="end" class="mono">键盘 A–L 弹奏 · Z/X 切八度 · 边弹边录</text>
  <text x="84" y="604" class="mono">切回对话后台继续播放 · 最多 32 个工程 (JSON)</text>

  <!-- Subtractive Engine Zone -->
  <rect x="60" y="644" width="780" height="292" rx="6" class="zone"/>
  <text x="84" y="676" class="eyebrow">WEB AUDIO 减法合成引擎</text>

  <rect x="84" y="700" width="212" height="92" rx="4" class="card"/>
  <text x="190" y="738" text-anchor="middle" class="name">振荡器 (OSC)</text>
  <text x="190" y="766" text-anchor="middle" class="mono">锯齿 · 方波 · 三角 · 低八度</text>

  <line x1="296" y1="746" x2="334" y2="746" class="arrow"/>
  <polygon points="334,740 344,746 334,752" class="arrowhead"/>

  <rect x="344" y="700" width="212" height="92" rx="4" class="card"/>
  <text x="450" y="738" text-anchor="middle" class="name">低通滤波 (LPF)</text>
  <text x="450" y="766" text-anchor="middle" class="mono">截止 · 共鸣 · 包络扫频</text>

  <line x1="556" y1="746" x2="594" y2="746" class="arrow"/>
  <polygon points="594,740 604,746 594,752" class="arrowhead"/>

  <rect x="604" y="700" width="212" height="92" rx="4" class="card-accent"/>
  <text x="710" y="738" text-anchor="middle" class="name">主总线 (Master)</text>
  <text x="710" y="766" text-anchor="middle" class="mono-accent">压缩器 · 实时输出</text>

  <rect x="84" y="814" width="356" height="94" rx="4" class="card-soft"/>
  <text x="104" y="852" class="name">ADSR 包络与 LFO</text>
  <text x="104" y="880" class="mono">作用于音高 · 滤波 · 音量</text>

  <rect x="460" y="814" width="356" height="94" rx="4" class="card-soft"/>
  <text x="480" y="852" class="name">效果发送与导出</text>
  <text x="480" y="880" class="mono">附点八分回声 · 混响 · MIDI / WAV</text>

  <!-- Legend Strip -->
  <line x1="60" y1="964" x2="840" y2="964" class="rule"/>
  <rect x="60" y="986" width="14" height="14" rx="2" class="card"/>
  <text x="84" y="998" class="mono">合成模块 / 网格</text>
  <rect x="256" y="986" width="14" height="14" rx="2" class="card-accent"/>
  <text x="280" y="998" class="mono">主总线 / 激活步进</text>
  <text x="840" y="998" text-anchor="end" class="mono-accent">PKG: dsh-synthesizer</text>

  <!-- Install Command -->
  <rect x="60" y="1028" width="780" height="56" rx="6" class="zone"/>
  <text x="84" y="1062" class="cmd">$ dsh plugin add github:yishan/dsh-synthesizer</text>

  <!-- Footer -->
  <line x1="60" y1="1112" x2="840" y2="1112" class="rule"/>
  <text x="60" y="1144" class="footer">DeepSeek Harness Plugins · by Yishan</text>
  <text x="840" y="1144" text-anchor="end" class="footer-link">dsh.yishan.app</text>
</svg>
