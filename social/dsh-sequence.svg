<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <style>
      .paper { fill: #f5f5f5; }
      .zone { fill: #ececec; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .card { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; }
      .card-accent { fill: rgba(77,107,254,0.08); stroke: #4d6bfe; stroke-width: 1.4; }
      .frame { fill: rgba(77,107,254,0.05); stroke: #bfc0c0; stroke-width: 1; stroke-dasharray: 6 4; }
      .tab { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; }
      .outer { fill: none; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .rule { stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .rule-solid { stroke: #bfc0c0; stroke-width: 1.5; }
      .lifeline { stroke: #bfc0c0; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .act { fill: #ececec; stroke: #2d3142; stroke-width: 1; }
      .act-accent { fill: rgba(77,107,254,0.12); stroke: #4d6bfe; stroke-width: 1.2; }
      .arrow { stroke: #2d3142; stroke-width: 1.3; }
      .arrow-dash { stroke: #4f5d75; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .arrow-accent { stroke: #4d6bfe; stroke-width: 1.5; }
      .head { fill: #2d3142; }
      .head-accent { fill: #4d6bfe; }
      .dot-accent { fill: #4d6bfe; }
      .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; fill: #7a8399; }
      .tag { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; fill: #4d6bfe; }
      .title { font-family: "Geist", "PingFang SC", sans-serif; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; fill: #2d3142; }
      .subtitle { font-family: "Geist", "PingFang SC", sans-serif; font-size: 20px; font-weight: 400; fill: #4f5d75; }
      .name { font-family: "Geist", "PingFang SC", sans-serif; font-size: 17px; font-weight: 600; fill: #2d3142; }
      .mono { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; fill: #4f5d75; }
      .mono-accent { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; font-weight: 500; fill: #4d6bfe; }
      .cmd { font-family: "Geist Mono", monospace; font-size: 16px; fill: #2d3142; }
      .footer { font-family: "Geist", "PingFang SC", sans-serif; font-size: 15px; fill: #4f5d75; }
      .footer-link { font-family: "Geist Mono", monospace; font-size: 15px; font-weight: 500; fill: #4d6bfe; }
    </style>
  </defs>

  <rect width="900" height="1200" class="paper"/>
  <rect x="28" y="28" width="844" height="1144" rx="8" class="outer"/>

  <!-- Header -->
  <text x="60" y="76" class="eyebrow">02 · 时序 · V0.1.0</text>
  <text x="840" y="76" text-anchor="end" class="tag">DEEPSEEK HARNESS PLUGIN</text>
  <text x="60" y="138" class="title">dsh-sequence</text>
  <text x="60" y="178" class="subtitle">对话内每轮 Agent 工具调用时序图与动画回放</text>
  <line x1="60" y1="208" x2="840" y2="208" class="rule"/>

  <!-- Sequence Diagram Canvas -->
  <rect x="60" y="236" width="780" height="700" rx="6" class="zone"/>
  <text x="84" y="266" class="eyebrow">TRAJECTORY SWIMLANE · DETERMINISTIC SVG</text>

  <!-- Actor Headers -->
  <rect x="96" y="290" width="128" height="44" rx="4" class="card"/>
  <text x="160" y="318" text-anchor="middle" class="name">用户</text>

  <rect x="288" y="290" width="128" height="44" rx="4" class="card-accent"/>
  <text x="352" y="318" text-anchor="middle" class="name">Agent</text>

  <rect x="480" y="290" width="128" height="44" rx="4" class="card"/>
  <text x="544" y="318" text-anchor="middle" class="name">工具</text>

  <rect x="672" y="290" width="128" height="44" rx="4" class="card"/>
  <text x="736" y="318" text-anchor="middle" class="name">子代理</text>

  <!-- Lifelines -->
  <line x1="160" y1="334" x2="160" y2="810" class="lifeline"/>
  <line x1="352" y1="334" x2="352" y2="810" class="lifeline"/>
  <line x1="544" y1="334" x2="544" y2="810" class="lifeline"/>
  <line x1="736" y1="334" x2="736" y2="810" class="lifeline"/>

  <!-- Activation Bars -->
  <rect x="346" y="376" width="12" height="404" rx="2" class="act"/>
  <rect x="538" y="476" width="12" height="58" rx="2" class="act"/>
  <rect x="730" y="544" width="12" height="66" rx="2" class="act-accent"/>
  <rect x="538" y="654" width="12" height="54" rx="2" class="act"/>

  <!-- Message 1: User -> Agent -->
  <line x1="160" y1="386" x2="336" y2="386" class="arrow"/>
  <polygon points="336,380 346,386 336,392" class="head"/>
  <text x="253" y="374" text-anchor="middle" class="mono">本轮输入 (Turn Prompt)</text>

  <!-- PAR Frame -->
  <rect x="316" y="430" width="460" height="196" rx="6" class="frame"/>
  <rect x="316" y="430" width="60" height="24" rx="3" class="tab"/>
  <text x="346" y="447" text-anchor="middle" class="eyebrow">PAR</text>

  <!-- Par 1: Agent -> Tools -->
  <line x1="358" y1="490" x2="528" y2="490" class="arrow"/>
  <polygon points="528,484 538,490 528,496" class="head"/>
  <text x="448" y="478" text-anchor="middle" class="mono">read_file</text>

  <!-- Par 2: Agent -> Subagents (Focal) -->
  <line x1="358" y1="564" x2="720" y2="564" class="arrow-accent"/>
  <polygon points="720,558 730,564 720,570" class="head-accent"/>
  <text x="544" y="550" text-anchor="middle" class="mono-accent">invoke_subagent (进行中)</text>

  <!-- Retry / Slow call -->
  <line x1="538" y1="690" x2="368" y2="690" class="arrow-dash"/>
  <polygon points="368,684 358,690 368,696" class="head"/>
  <text x="448" y="676" text-anchor="middle" class="mono">retry · &gt;= 3s</text>

  <!-- Response: Agent -> User -->
  <line x1="346" y1="766" x2="170" y2="766" class="arrow-dash"/>
  <polygon points="170,760 160,766 170,772" class="head"/>
  <text x="253" y="754" text-anchor="middle" class="mono">助手输出</text>

  <!-- Playback Scrubber Strip -->
  <rect x="84" y="838" width="732" height="74" rx="4" class="card"/>
  <text x="104" y="880" class="mono">播放 / 单步 &lt;- -&gt; · 0.5x–5x</text>
  <line x1="364" y1="875" x2="570" y2="875" class="rule-solid"/>
  <circle cx="492" cy="875" r="6" class="dot-accent"/>
  <text x="796" y="880" text-anchor="end" class="mono">仅看异常 · 导出 SVG / HTML</text>

  <!-- Legend Strip -->
  <line x1="60" y1="964" x2="840" y2="964" class="rule"/>
  <rect x="60" y="986" width="14" height="14" rx="2" class="card"/>
  <text x="84" y="998" class="mono">参与方 / 工具调用</text>
  <rect x="256" y="986" width="14" height="14" rx="2" class="card-accent"/>
  <text x="280" y="998" class="mono">主 Agent / 子代理焦点</text>
  <text x="840" y="998" text-anchor="end" class="mono-accent">PKG: dsh-sequence</text>

  <!-- Install Command -->
  <rect x="60" y="1028" width="780" height="56" rx="6" class="zone"/>
  <text x="84" y="1062" class="cmd">$ dsh plugin add dsh-sequence</text>

  <!-- Footer -->
  <line x1="60" y1="1112" x2="840" y2="1112" class="rule"/>
  <text x="60" y="1144" class="footer">DeepSeek Harness Plugins · by Yishan</text>
  <text x="840" y="1144" text-anchor="end" class="footer-link">dsh.yishan.app</text>
</svg>
