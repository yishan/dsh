<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <style>
      .paper { fill: #f5f5f5; }
      .zone { fill: #ececec; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .card { fill: #ffffff; stroke: #bfc0c0; stroke-width: 1; }
      .card-soft { fill: #f5f5f5; stroke: rgba(45,49,66,0.16); stroke-width: 1; }
      .card-accent { fill: rgba(77,107,254,0.08); stroke: #4d6bfe; stroke-width: 1.4; }
      .outer { fill: none; stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .rule { stroke: rgba(45,49,66,0.14); stroke-width: 1; }
      .arrow { stroke: #2d3142; stroke-width: 1.2; }
      .arrowhead { fill: #2d3142; }
      .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; fill: #7a8399; }
      .tag { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; fill: #4d6bfe; }
      .title { font-family: "Geist", "PingFang SC", sans-serif; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; fill: #2d3142; }
      .subtitle { font-family: "Geist", "PingFang SC", sans-serif; font-size: 20px; font-weight: 400; fill: #4f5d75; }
      .name { font-family: "Geist", "PingFang SC", sans-serif; font-size: 18px; font-weight: 600; fill: #2d3142; }
      .mono { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; fill: #4f5d75; }
      .mono-accent { font-family: "Geist Mono", "PingFang SC", monospace; font-size: 14px; font-weight: 500; fill: #4d6bfe; }
      .cmd { font-family: "Geist Mono", monospace; font-size: 16px; fill: #2d3142; }
      .footer { font-family: "Geist", "PingFang SC", sans-serif; font-size: 15px; fill: #4f5d75; }
      .footer-link { font-family: "Geist Mono", monospace; font-size: 15px; font-weight: 500; fill: #4d6bfe; }
    </style>
  </defs>

  <rect width="900" height="1200" class="paper"/>
  <rect x="28" y="28" width="844" height="1144" rx="8" class="outer"/>

  <!-- Header -->
  <text x="60" y="76" class="eyebrow">04 · 打字练习 · V0.2.0</text>
  <text x="840" y="76" text-anchor="end" class="tag">DEEPSEEK HARNESS PLUGIN</text>
  <text x="60" y="138" class="title">dsh-typing-practice</text>
  <text x="60" y="178" class="subtitle">原生输入法打字练习、注音提示与落词游戏</text>
  <line x1="60" y1="208" x2="840" y2="208" class="rule"/>

  <!-- Zone 1: Text Sources -->
  <rect x="60" y="236" width="780" height="158" rx="6" class="zone"/>
  <text x="84" y="266" class="eyebrow">01 · 文本来源</text>
  <rect x="84" y="286" width="356" height="84" rx="4" class="card"/>
  <text x="104" y="318" class="name">288 篇内置短文</text>
  <text x="104" y="346" class="mono">EN · 简体中文 · 粵語 (96 篇/语)</text>

  <rect x="460" y="286" width="356" height="84" rx="4" class="card-soft"/>
  <text x="480" y="318" class="name">近 30 天本地对话</text>
  <text x="480" y="346" class="mono">用户提问 + 模型回复 · 当前 profile 片段</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="450" y1="394" x2="450" y2="424" class="arrow"/>
  <polygon points="444,424 450,434 456,424" class="arrowhead"/>

  <!-- Zone 2: Native IME & Modes -->
  <rect x="60" y="434" width="780" height="236" rx="6" class="zone"/>
  <text x="84" y="464" class="eyebrow">02 · 原生输入法与双模式</text>

  <rect x="84" y="484" width="732" height="78" rx="4" class="card-accent"/>
  <text x="104" y="516" class="name">打字练习模式</text>
  <text x="104" y="544" class="mono-accent">全拼 · 双拼 (小鹤/自然码/微软/搜狗) · 粤拼提示</text>
  <text x="796" y="530" text-anchor="end" class="mono">15s / 30s / 60s · 固定行焦点</text>

  <rect x="84" y="576" width="732" height="72" rx="4" class="card"/>
  <text x="104" y="608" class="name">落词游戏</text>
  <text x="104" y="633" class="mono">系统输入法上屏 -&gt; 发射光标击中词条 · 5 点生命 · 每 30s 升级</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="670" x2="450" y2="700" class="arrow"/>
  <polygon points="444,700 450,710 456,700" class="arrowhead"/>

  <!-- Zone 3: Feedback & Audio -->
  <rect x="60" y="710" width="780" height="226" rx="6" class="zone"/>
  <text x="84" y="740" class="eyebrow">03 · 实时反馈与机械轴音效</text>

  <rect x="84" y="762" width="234" height="150" rx="4" class="card"/>
  <text x="102" y="796" class="name">实时统计</text>
  <text x="102" y="832" class="mono">WPM (英文)</text>
  <text x="102" y="858" class="mono">CPM (中文 / 粤语)</text>
  <text x="102" y="884" class="mono">准确率 · 错误计数</text>

  <rect x="333" y="762" width="234" height="150" rx="4" class="card"/>
  <text x="351" y="796" class="name">4 套机械轴音效</text>
  <text x="351" y="832" class="mono">Cherry MX Blue / Brown</text>
  <text x="351" y="858" class="mono">NovelKeys Cream</text>
  <text x="351" y="884" class="mono">Holy Panda (kbsim)</text>

  <rect x="582" y="762" width="234" height="150" rx="4" class="card-soft"/>
  <text x="600" y="796" class="name">本地记录与快捷键</text>
  <text x="600" y="832" class="mono">最佳成绩 + 最近 100 轮</text>
  <text x="600" y="858" class="mono">⌘R 换篇 · ⌘T 切语言</text>
  <text x="600" y="884" class="mono">⌘D 时长 · ⌘L 篇幅</text>

  <!-- Legend Strip -->
  <line x1="60" y1="964" x2="840" y2="964" class="rule"/>
  <rect x="60" y="986" width="14" height="14" rx="2" class="card"/>
  <text x="84" y="998" class="mono">文本 / 反馈模块</text>
  <rect x="256" y="986" width="14" height="14" rx="2" class="card-accent"/>
  <text x="280" y="998" class="mono">原生输入法 + 注音核心</text>
  <text x="840" y="998" text-anchor="end" class="mono-accent">PKG: dsh-typing-practice</text>

  <!-- Install Command -->
  <rect x="60" y="1028" width="780" height="56" rx="6" class="zone"/>
  <text x="84" y="1062" class="cmd">$ dsh plugin add dsh-typing-practice</text>

  <!-- Footer -->
  <line x1="60" y1="1112" x2="840" y2="1112" class="rule"/>
  <text x="60" y="1144" class="footer">DeepSeek Harness Plugins · by Yishan</text>
  <text x="840" y="1144" text-anchor="end" class="footer-link">dsh.yishan.app</text>
</svg>
